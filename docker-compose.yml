services:
  kiosque:
    build: .
    image: kiosque:latest
    container_name: kiosque
    restart: unless-stopped
    ports:
      # Port de ton serveur → port du conteneur (toujours 3010).
      # Change KIOSQUE_PORT (.env ou variables de la stack Portainer) pour utiliser un autre port, ex. 3000.
      - "${KIOSQUE_PORT:-3010}:3010"
    environment:
      # Facultatif : tout se règle aussi dans la page (Réglages → Clés & accès)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PANDASCORE_TOKEN=${PANDASCORE_TOKEN:-}
      # Comparateur de prix : relais quand un site bloque le serveur (off pour le couper)
      - PRICES_RELAY=${PRICES_RELAY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
    volumes:
      - kiosque-data:/app/data

volumes:
  kiosque-data:
